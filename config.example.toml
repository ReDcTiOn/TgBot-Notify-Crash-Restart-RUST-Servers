# Скопируйте в config.toml и поправьте chat_id / thread_id.
# Секреты (токен бота, пароли RCON) лежат в .env, не здесь.

[telegram]
# Супергруппа с включёнными «Темами». ID вида -100XXXXXXXXXX.
chat_id = -1001234567890
# Тема по умолчанию (для сообщения о запуске бота и серверов без своей темы). 0 = без темы.
default_thread_id = 0
notify_on_start = true

[monitor]
poll_interval = 10          # как часто опрашивать Query, секунды
query_timeout = 3
fail_threshold = 3          # столько неудачных проверок подряд = сервер упал (~30 с)
recover_threshold = 2       # столько удачных подряд = сервер вернулся
graceful_window = 900       # признак штатной остановки действует столько секунд
restart_max_downtime = 900  # не вернулся за это время после штатной остановки = «выключен»
uptime_slack = 90           # допуск при сравнении uptime для поиска пропущенных рестартов
timezone = "Europe/Moscow"
state_file = "state.json"

[rcon]
heartbeat_interval = 15
# Закрытие WebRCON-соединения сервером с нормальным кодом считать штатной остановкой.
clean_close_is_graceful = true
# Строки консоли (кроме чата), означающие штатную остановку/рестарт. Проверьте на своих серверах: README, «Проверка».
shutdown_patterns = [
    '\bshutting down\b',
    '\bserver (is )?restarting\b',
    '\brestarting in \d+',
    '\brestart(ing)? (the )?server\b',
    '\[rcon\].*\b(global\.)?(quit|restart)\b',
]

# query_port = game_port + 1 и rcon_port = game_port + 2 вычисляются сами,
# при другой раскладке укажите query_port / rcon_port явно.
# thread_id: ID темы этого сервера в группе (0 = default_thread_id).

[[servers]]
